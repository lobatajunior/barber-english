<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Aprende inglés para barberos">
  <meta name="theme-color" content="#080808">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Barber English">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=3"/>

  <title>Barber English</title>
  <link rel="manifest" href="manifest.json?v=3">
  <!-- CanvasKit, SDK de Firebase y fuentes (Outfit/Roboto) vienen de estos orígenes. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="splash.webp" as="image" type="image/webp">
  <style>
    /* Alto = zona visible real (100dvh descuenta las barras del navegador y del
       navegador interno de Instagram); 100% queda como respaldo. Sin scroll de página. */
    html, body { margin: 0; height: 100%; height: 100dvh; overflow: hidden; background: #080808; }
    /* Sonda para que Dart lea el área segura (muesca / barra de gestos). */
    #safe-area-probe {
      position: fixed; top: 0; left: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
      padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #080808; transition: opacity .35s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash img { width: 96px; height: 150px; object-fit: contain; }
    #splash .bar {
      width: 140px; height: 4px; margin-top: 28px; border-radius: 2px;
      background: rgba(0, 230, 118, .15); overflow: hidden;
    }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 2px;
      background: #00E676; animation: splash-slide 1.1s ease-in-out infinite;
    }
    @keyframes splash-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) {
      #splash .bar::after { animation: none; width: 100%; opacity: .6; }
    }
  </style>
  <!-- TTS: no bloquea el arranque; tts_web.dart usa Web Speech si aún no cargó. -->
  <script async src="https://code.responsivevoice.org/responsivevoice.js?key=FREE"></script>
</head>
<body>
  <!-- Pantalla de carga mientras Flutter arranca; se quita en el primer frame. -->
  <div id="splash" role="progressbar" aria-label="Cargando Barber English">
    <img src="splash.webp" alt="">
    <div class="bar"></div>
  </div>
  <div id="safe-area-probe"></div>
  <script>
    // Área segura en px, leída desde Dart (lib/services/safe_area_web.dart).
    window.beSafeAreaInsets = function () {
      var el = document.getElementById('safe-area-probe');
      if (!el) return [0, 0];
      var cs = getComputedStyle(el);
      return [parseFloat(cs.paddingTop) || 0, parseFloat(cs.paddingBottom) || 0];
    };
    // Flutter reemplaza el meta viewport al arrancar y quita viewport-fit=cover:
    // se vuelve a añadir en cuanto aparece su meta.
    (function () {
      function fixViewport() {
        var metas = document.querySelectorAll('meta[name="viewport"]');
        for (var i = 0; i < metas.length; i++) {
          var c = metas[i].getAttribute('content') || '';
          if (c.indexOf('viewport-fit') === -1) metas[i].setAttribute('content', c + ', viewport-fit=cover');
        }
      }
      new MutationObserver(fixViewport).observe(document.head, { childList: true });
    })();
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('splash');
      if (!el) return;
      el.classList.add('hide');
      setTimeout(function () { el.remove(); }, 400);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
